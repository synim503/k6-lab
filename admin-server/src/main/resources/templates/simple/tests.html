<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Тесты</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-clipboard2-check"></i></span>Тесты</h3>
        <a class="btn btn-primary" th:href="@{/quick/test/new}"><i class="bi bi-plus-lg me-1"></i>Создать тест</a>
    </div>
    <div class="card"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Название</th><th>Изменён</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${tests.isEmpty()}"><td colspan="3"><div class="empty-state"><i class="bi bi-inbox"></i>Тестов пока нет — нажмите «Создать тест»</div></td></tr>
        <tr th:each="t : ${tests}">
            <td><a th:href="@{/scenarios/{id}(id=${t.id})}" th:text="${t.name}"></a></td>
            <td class="text-muted small" th:text="${#temporals.format(t.updatedAt, 'dd.MM.yyyy HH:mm')}"></td>
            <td class="text-end"><a class="btn btn-sm btn-success" th:href="@{/quick/test/{id}/run(id=${t.id})}"><i class="bi bi-play-fill me-1"></i>Запустить</a></td>
        </tr></tbody></table></div>
</th:block>
</body>
</html>
