<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Запустить тест</title></head>
<body>
<th:block layout:fragment="content">
    <h3 class="mb-3 d-flex align-items-center gap-2"><span class="icon-tile"><i class="bi bi-play-circle"></i></span>Запустить: <span th:text="${test.name}"></span></h3>
    <form class="card card-body mx-0" style="max-width: 640px" th:action="@{/quick/test/{id}/run(id=${test.id})}" method="post">
        <div class="mb-2 fw-semibold">На каких серверах запускать</div>
        <div class="text-muted" th:if="${generators.isEmpty()}">Серверов нет — <a th:href="@{/quick/generator}">добавьте сервер</a>.</div>
        <div class="form-check" th:each="g : ${generators}">
            <input class="form-check-input" type="checkbox" name="generatorId" th:id="'g' + ${g.id}" th:value="${g.id}"
                   th:checked="${g.availableForRuns}" th:disabled="${!g.availableForRuns}">
            <label class="form-check-label" th:for="'g' + ${g.id}">
                <span th:text="${g.name}"></span>
                <span class="badge ms-1" th:classappend="${g.availableForRuns} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${g.availableForRuns} ? 'свободен' : (${g.busy} ? 'занят' : ${g.status.title})"></span></label></div>
        <div class="mt-3"><button class="btn btn-success btn-lg" th:disabled="${generators.isEmpty()}"><i class="bi bi-play-fill me-1"></i>Запустить тест</button>
            <a class="btn btn-link" th:href="@{/quick/tests}">Отмена</a></div>
        <div class="alert alert-danger mt-3 mb-0" th:if="${error}" th:text="${error}"></div>
    </form>
</th:block>
</body>
</html>
