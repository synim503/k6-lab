<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="refs" th:remove="tag">
<div class="card">
    <div class="card-header">Репозиторий <strong th:text="${repo.name}"></strong></div>
    <div class="card-body">
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-warning" th:if="${hostKey != null}">
            <p class="mb-1">Ключ SSH-хоста <strong th:text="${hostKey.host() + ':' + hostKey.port()}"></strong> не подтверждён.
                Тип: <code th:text="${hostKey.keyType()}"></code>, fingerprint: <code th:text="${hostKey.fingerprint()}"></code></p>
            <form sec:authorize="hasRole('ADMIN')" th:action="@{/git-repos/confirm-host-key}" method="post">
                <input type="hidden" name="host" th:value="${hostKey.host()}"><input type="hidden" name="port" th:value="${hostKey.port()}">
                <input type="hidden" name="keyType" th:value="${hostKey.keyType()}"><input type="hidden" name="fingerprint" th:value="${hostKey.fingerprint()}">
                <input type="hidden" name="publicKey" th:value="${hostKey.publicKey()}"><input type="hidden" name="repoId" th:value="${repo.id}">
                <button class="btn btn-warning btn-sm">Доверять этому ключу</button></form>
        </div>
        <div th:if="${refs != null}">
            <div class="text-success mb-2">Доступ есть. Веток и тегов: <span th:text="${refs.size()}"></span></div>
            <div class="d-flex flex-wrap gap-1">
                <span class="badge" th:each="r : ${refs}" th:classappend="${r.kind() == 'branch'} ? 'text-bg-primary' : 'text-bg-secondary'"
                      th:text="${r.name()}" th:title="${r.commit()}"></span></div>
        </div>
    </div></div>
</div>
</body>
</html>
