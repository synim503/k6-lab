<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Пользователи</title></head>
<body>
<th:block layout:fragment="content">
    <h3 class="mb-3 d-flex align-items-center gap-2"><span class="icon-tile"><i class="bi bi-people"></i></span>Пользователи</h3>
    <div class="card mb-4"><div class="card-header">Новый пользователь</div>
        <form class="card-body row g-2" th:action="@{/users}" method="post" autocomplete="off">
            <div class="col-md-3"><input class="form-control" name="username" placeholder="Логин" required></div>
            <div class="col-md-3"><input class="form-control" type="password" name="password" placeholder="Пароль (от 8 символов)" required autocomplete="new-password"></div>
            <div class="col-md-3"><select class="form-select" name="role"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></div>
            <div class="col-md-3"><button class="btn btn-primary">Создать</button></div>
        </form></div>

    <div class="card"><table class="table table-sm mb-0">
        <thead class="table-light"><tr><th>Логин</th><th>Роль</th><th>Активен</th><th>Новый пароль</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.username}"></td>
            <td colspan="2">
                <form class="d-flex gap-2 align-items-center" th:action="@{/users/{id}(id=${u.id})}" method="post">
                    <select class="form-select form-select-sm w-auto" name="role">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option></select>
                    <div class="form-check"><input class="form-check-input" type="checkbox" name="enabled" value="true" th:checked="${u.enabled}">
                        <label class="form-check-label">активен</label></div>
                    <button class="btn btn-sm btn-outline-primary py-0">сохранить</button>
                </form></td>
            <td><form class="d-flex gap-2" th:action="@{/users/{id}/password(id=${u.id})}" method="post" autocomplete="off">
                <input class="form-control form-control-sm" type="password" name="password" placeholder="новый пароль" autocomplete="new-password">
                <button class="btn btn-sm btn-outline-secondary py-0">сменить</button></form></td>
            <td class="text-end"><form th:action="@{/users/{id}/delete(id=${u.id})}" method="post" onsubmit="return confirm('Удалить пользователя?')">
                <button class="btn btn-sm btn-outline-danger py-0">удалить</button></form></td>
        </tr></tbody></table></div>
</th:block>
</body>
</html>
