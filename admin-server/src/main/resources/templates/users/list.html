<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Пользователи</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div>
            <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-people"></i></span>Пользователи</h3>
            <div class="sub mt-1">Администратор управляет всем, пользователь запускает скрипты и смотрит результаты.</div></div>
    </div>

    <div class="card mb-3"><div class="card-body">
        <h6 class="fw-semibold mb-3">Новый пользователь</h6>
        <form class="row g-3 align-items-end" th:action="@{/users}" method="post" autocomplete="off">
            <div class="col-md-3"><label class="form-label" for="u-login">Логин</label><input class="form-control" id="u-login" name="username" required></div>
            <div class="col-md-3"><label class="form-label" for="u-pass">Пароль</label>
                <input class="form-control" id="u-pass" type="password" name="password" placeholder="от 8 символов" required autocomplete="new-password"></div>
            <div class="col-md-3"><label class="form-label" for="u-role">Роль</label>
                <select class="form-select" id="u-role" name="role"><option th:each="r : ${roles}" th:value="${r}" th:text="${r.name() == 'ADMIN'} ? 'Администратор' : 'Пользователь'"></option></select></div>
            <div class="col-md-3"><button class="btn btn-primary w-100"><i class="bi bi-person-plus me-1"></i>Создать</button></div>
        </form>
    </div></div>

    <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead><tr><th>Логин</th><th>Роль и доступ</th><th>Новый пароль</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td class="fw-semibold" th:text="${u.username}"></td>
            <td>
                <form class="d-flex gap-3 align-items-center flex-wrap" th:action="@{/users/{id}(id=${u.id})}" method="post">
                    <select class="form-select form-select-sm w-auto" name="role" aria-label="Роль">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.name() == 'ADMIN'} ? 'Администратор' : 'Пользователь'" th:selected="${r == u.role}"></option></select>
                    <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" role="switch" name="enabled" value="true" th:checked="${u.enabled}" th:id="'en' + ${u.id}">
                        <label class="form-check-label small" th:for="'en' + ${u.id}">активен</label></div>
                    <button class="btn btn-sm btn-outline-primary">Сохранить</button>
                </form></td>
            <td><form class="d-flex gap-2" th:action="@{/users/{id}/password(id=${u.id})}" method="post" autocomplete="off">
                <input class="form-control form-control-sm" style="max-width:200px" type="password" name="password" placeholder="новый пароль" aria-label="Новый пароль" autocomplete="new-password">
                <button class="btn btn-sm btn-outline-secondary">Сменить</button></form></td>
            <td class="text-end"><form th:action="@{/users/{id}/delete(id=${u.id})}" method="post" onsubmit="return confirm('Удалить пользователя?')">
                <button class="btn btn-sm btn-outline-danger btn-icon" title="Удалить" aria-label="Удалить"><i class="bi bi-trash"></i></button></form></td>
        </tr></tbody></table></div></div>
</th:block>
</body>
</html>
