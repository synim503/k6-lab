<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>История запусков</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-activity"></i></span>История запусков</h3>
        <a class="btn btn-success" th:href="@{/runs/new}">Новый запуск</a>
    </div>
    <form class="row g-2 mb-3" method="get" th:action="@{/runs}">
        <div class="col-md-4"><select class="form-select form-select-sm" name="scenarioId">
            <option value="">все сценарии</option>
            <option th:each="s : ${scenarios}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == scenarioId}"></option></select></div>
        <div class="col-md-3"><select class="form-select form-select-sm" name="status">
            <option value="">любой статус</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option></select></div>
        <div class="col-md-2"><button class="btn btn-sm btn-outline-secondary">Фильтр</button></div>
    </form>
    <form method="get" th:action="@{/runs/compare}">
        <div class="card"><table class="table table-sm table-hover mb-0">
            <thead class="table-light"><tr><th>A</th><th>B</th><th>#</th><th>Сценарий</th><th>Статус</th><th>Поставлен</th><th>Длительность</th><th>Вывод</th><th></th></tr></thead>
            <tbody>
            <tr th:if="${runs.isEmpty()}"><td colspan="9"><div class="empty-state"><i class="bi bi-inbox"></i>Запусков нет</div></td></tr>
            <tr th:each="r, st : ${runs}">
                <td><input type="radio" name="a" th:value="${r.id}"></td><td><input type="radio" name="b" th:value="${r.id}"></td>
                <td><a th:href="@{/runs/{id}(id=${r.id})}" th:text="${r.id}"></a></td>
                <td><span th:text="${r.scenarioName}"></span> <span class="badge text-bg-warning" th:if="${r.baseline}">эталон</span></td>
                <td><span class="badge" th:text="${r.status}"
                          th:classappend="${r.status.name() == 'FINISHED'} ? (${r.thresholdsFailed} ? 'text-bg-warning' : 'text-bg-success') : (${r.status.name() == 'FAILED'} ? 'text-bg-danger' : (${r.status.name() == 'ABORTED'} ? 'text-bg-secondary' : 'text-bg-primary'))"></span>
                    <span class="badge text-bg-warning" th:if="${r.degraded}" title="генератор отваливался">DEGRADED</span></td>
                <td class="text-nowrap" th:text="${#temporals.format(r.queuedAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td th:text="${r.startedAt != null and r.finishedAt != null} ? ${T(java.time.Duration).between(r.startedAt, r.finishedAt).toMinutes()} + ' мин' : '—'"></td>
                <td class="small" th:text="${r.conclusion} ?: ''"></td>
                <td class="small text-danger" th:text="${r.error} ?: ${r.stopReason}"></td>
            </tr></tbody></table></div>
        <div class="mt-2"><button class="btn btn-outline-primary btn-sm">Сравнить выбранные (A и B)</button></div>
    </form>
</th:block>
</body>
</html>
