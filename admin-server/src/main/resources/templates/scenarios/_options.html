<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="models">
    <option value="">— выберите модель —</option>
    <option th:each="m : ${models}" th:value="${m.id}" th:text="${m.name}"></option>
</th:block>
<th:block th:fragment="versions">
    <option th:each="v : ${versions}" th:value="${v.id}" th:disabled="${!v.validForModel}"
            th:text="'v' + ${v.number} + ' — ' + ${v.sourceLabel()} + (${v.validForModel} ? '' : ' (непригодна)')"></option>
</th:block>
<div th:fragment="data" id="data-files">
    <div class="text-muted small" th:if="${rows.isEmpty()}">В архиве скрипта нет файлов данных.</div>
    <table class="table table-sm mb-0" th:unless="${rows.isEmpty()}">
        <thead><tr><th>Файл данных</th><th>Режим</th><th title="первая строка - заголовок (сохраняется в каждой части)">Заголовок</th><th title="данные расходуются: каждая строка используется один раз">Расходуются</th></tr></thead>
        <tbody>
        <tr th:each="d, st : ${rows}">
            <td><code th:text="${d.path}"></code><input type="hidden" th:name="|dataFiles[${st.index}].path|" th:value="${d.path}"></td>
            <td><select class="form-select form-select-sm" th:name="|dataFiles[${st.index}].mode|">
                <option th:each="m : ${modes}" th:value="${m}" th:text="${m.title}" th:selected="${m == d.mode}"></option></select></td>
            <td><input class="form-check-input" type="checkbox" value="true" th:name="|dataFiles[${st.index}].hasHeader|" th:checked="${d.hasHeader}"></td>
            <td><input class="form-check-input" type="checkbox" value="true" th:name="|dataFiles[${st.index}].consumed|" th:checked="${d.consumed}"></td>
        </tr></tbody></table>
</div>
</body>
</html>
