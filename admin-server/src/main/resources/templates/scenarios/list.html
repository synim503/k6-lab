<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Сценарии</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-diagram-3"></i></span>Сценарии</h3>
        <a class="btn btn-primary" th:href="@{/scenarios/new}">Создать сценарий</a>
    </div>
    <div class="card"><table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>Имя</th><th>Скрипт</th><th>Версия</th><th>Модель</th><th>Профиль</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${scenarios.isEmpty()}"><td colspan="6"><div class="empty-state"><i class="bi bi-inbox"></i>Сценариев пока нет</div></td></tr>
        <tr th:each="s : ${scenarios}">
            <td><a th:href="@{/scenarios/{id}(id=${s.id})}" th:text="${s.name}"></a> <span class="badge text-bg-warning" th:if="${s.expertMode}">эксперт</span>
                <span class="badge text-bg-info" th:if="${s.template}">шаблон</span></td>
            <td th:text="${scriptNames.get(s.scriptId)}"></td>
            <td th:text="${s.followBranch} ? 'последняя ветки Git' : (${s.scriptVersionId != null} ? 'закреплена' : 'последняя')"></td>
            <td th:text="${modelNames.get(s.modelId)}"></td><td th:text="${profileNames.get(s.profileId)}"></td>
            <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary py-0" th:href="@{/scenarios/{id}/edit(id=${s.id})}">изменить</a>
                <form class="d-inline" th:action="@{/scenarios/{id}/clone(id=${s.id})}" method="post"><button class="btn btn-sm btn-outline-secondary py-0">клонировать</button></form>
            </td></tr></tbody></table></div>
</th:block>
</body>
</html>
