<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Модели нагрузки</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-bar-chart-steps"></i></span>Модели нагрузки</h3>
        <a class="btn btn-primary" th:href="@{/models/new}">Создать модель</a>
    </div>
    <div class="card"><table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>Имя</th><th>Скрипт</th><th>Операции</th><th>Общая интенсивность</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${models.isEmpty()}"><td colspan="5"><div class="empty-state"><i class="bi bi-inbox"></i>Моделей пока нет</div></td></tr>
        <tr th:each="m : ${models}">
            <td><a th:href="@{/models/{id}/edit(id=${m.id})}" th:text="${m.name}"></a> <span class="badge text-bg-info" th:if="${m.template}">шаблон</span></td>
            <td th:text="${scriptNames.get(m.scriptId)}"></td>
            <td><span th:each="o : ${m.operations}" class="badge me-1" th:classappend="${o.enabled} ? 'text-bg-secondary' : 'text-bg-light text-muted'"
                      th:text="${o.name} + (${o.mode.name() == 'CLOSED'} ? ' ⟲' : '')"></span></td>
            <td th:text="${#numbers.formatDecimal(m.totalPerSec, 1, 3)} + ' оп/с (' + ${#numbers.formatDecimal(m.totalPerSec * 3600, 1, 0)} + ' оп/ч)'"></td>
            <td class="text-end text-nowrap">
                <form class="d-inline" th:action="@{/models/{id}/clone(id=${m.id})}" method="post"><button class="btn btn-sm btn-outline-secondary py-0">клонировать</button></form>
                <form class="d-inline" th:action="@{/models/{id}/delete(id=${m.id})}" method="post" onsubmit="return confirm('Удалить модель?')"><button class="btn btn-sm btn-outline-danger py-0">удалить</button></form>
            </td></tr></tbody></table></div>
</th:block>
</body>
</html>
