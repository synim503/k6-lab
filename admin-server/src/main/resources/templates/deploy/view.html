<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title th:text="'Операция #' + ${d.id}">Операция</title></head>
<body>
<th:block layout:fragment="content">
    <nav class="crumbs" aria-label="Навигация"><a th:href="@{/deployments}">Операции</a><i class="bi bi-chevron-right"></i><span th:text="'#' + ${d.id}"></span></nav>
    <div class="page-head">
        <div>
            <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-tools"></i></span><span th:text="${fmt.deployOperation(d.operation.name())}"></span></h3>
            <div class="sub mt-1"><span th:text="${d.targetHost}"></span> · запущена <span th:text="${#temporals.format(d.startedAt, 'dd.MM.yyyy HH:mm')}"></span>
                <span th:if="${d.startedBy != null}" th:text="'· ' + ${d.startedBy}"></span></div></div>
        <a class="btn btn-outline-secondary" th:href="@{/deployments}"><i class="bi bi-arrow-left me-1"></i>К списку</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <div id="deploy-status" th:fragment="status" hx-get="" th:attr="hx-get=@{/deployments/{id}/status(id=${d.id})}"
                 hx-trigger="refresh" hx-swap="outerHTML">
                <div class="card mb-3">
                    <div class="card-body">
                        <span class="badge fs-6" th:text="${fmt.deployStatus(d.status.name())}" th:classappend="${fmt.deployBadge(d.status.name())}"></span>
                        <div class="text-danger mt-2" th:if="${d.error}" th:text="${d.error}"></div>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item text-muted" th:if="${d.steps.isEmpty()}">Шаги ещё не начались…</li>
                        <li class="list-group-item" th:each="s : ${d.steps}">
                            <span class="d-inline-flex align-items-center gap-2" th:classappend="'step-' + ${s.status}">
                                <span th:switch="${s.status}" class="flex-shrink-0">
                                    <i th:case="'OK'" class="bi bi-check-circle-fill"></i>
                                    <i th:case="'FAILED'" class="bi bi-x-circle-fill"></i>
                                    <i th:case="'SKIPPED'" class="bi bi-dash-circle"></i>
                                    <span th:case="'RUNNING'" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                    <i th:case="*" class="bi bi-circle"></i>
                                </span>
                                <span th:text="${s.n} + '. ' + ${s.name}"></span>
                            </span>
                            <div class="small text-muted ms-4" th:if="${s.message}" th:text="${s.message}"></div>
                        </li>
                    </ul>
                </div>

                <div class="card border-warning" th:if="${d.status.name() == 'WAITING_HOST_KEY'}">
                    <div class="card-header bg-warning-subtle"><i class="bi bi-shield-exclamation me-1"></i>Подтвердите ключ хоста</div>
                    <div class="card-body">
                        <p class="small">Хост <strong th:text="${d.hostKeyHost} + ':' + ${d.hostKeyPort}"></strong> подключается впервые.
                            Сверьте fingerprint с тем, что показывает сам хост:</p>
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <code class="flex-grow-1 small">ssh-keygen -lf /etc/ssh/ssh_host_*_key.pub</code>
                            <button type="button" class="btn btn-sm btn-outline-secondary k6-copy-btn"
                                    data-copy="ssh-keygen -lf /etc/ssh/ssh_host_*_key.pub" title="Копировать команду" aria-label="Копировать команду"><i class="bi bi-clipboard"></i></button>
                        </div>
                        <dl class="mb-3 small">
                            <dt>Тип ключа</dt><dd th:text="${d.hostKeyType}"></dd>
                            <dt>Fingerprint (SHA256)</dt>
                            <dd class="d-flex align-items-center gap-2 flex-wrap">
                                <code class="text-break" th:text="${d.hostKeyFingerprint}"></code>
                                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 k6-copy-btn"
                                        th:attr="data-copy=${d.hostKeyFingerprint}" title="Копировать fingerprint" aria-label="Копировать fingerprint"><i class="bi bi-clipboard"></i></button>
                            </dd>
                        </dl>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/deployments/{id}/confirm-host-key(id=${d.id})}" method="post">
                            <button class="btn btn-warning"><i class="bi bi-shield-check me-1"></i>Доверять и продолжить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header py-2 d-flex align-items-center gap-2 flex-wrap">
                    <span class="small fw-semibold"><i class="bi bi-terminal me-1 text-primary"></i>Журнал операции</span>
                    <span id="deploy-sse-badge" class="badge text-bg-primary"
                          th:if="${d.status.name() == 'RUNNING' or d.status.name() == 'WAITING_HOST_KEY'}">в реальном времени</span>
                    <div class="ms-auto d-flex gap-1">
                        <button type="button" id="deploy-log-down" class="btn btn-sm btn-outline-primary d-none"><i class="bi bi-arrow-down me-1"></i>Вниз</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary k6-copy-btn" data-copy-target="#deploy-log"><i class="bi bi-clipboard me-1"></i>Копировать</button>
                    </div>
                </div>
                <pre id="deploy-log" class="log-view mb-0" style="border-radius:0 0 13px 13px;border:0" th:attr="data-stream=@{/deployments/{id}/stream(id=${d.id})}"></pre>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
