<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title th:text="'Операция #' + ${d.id}">Операция</title></head>
<body>
<th:block layout:fragment="content">
    <nav class="crumbs" aria-label="Навигация"><a th:href="@{/deployments}">Операции</a><i class="bi bi-chevron-right"></i><span th:text="'#' + ${d.id}"></span></nav>
    <div class="page-head">
        <div>
            <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-tools"></i></span><span th:text="${fmt.deployOperation(d.operation.name())}"></span></h3>
            <div class="sub mt-1"><span th:text="${d.targetHost}"></span> · запущена <span th:text="${#temporals.format(d.startedAt, 'dd.MM.yyyy HH:mm')}"></span>
                <span th:if="${d.startedBy != null}" th:text="'· ' + ${d.startedBy}"></span></div></div>
        <a class="btn btn-outline-secondary" th:href="@{/deployments}"><i class="bi bi-arrow-left me-1"></i>К списку</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <div id="deploy-status" th:fragment="status" hx-get="" th:attr="hx-get=@{/deployments/{id}/status(id=${d.id})}"
                 hx-trigger="refresh" hx-swap="outerHTML">
                <div class="card mb-3">
                    <div class="card-body">
                        <span class="badge fs-6" th:text="${fmt.deployStatus(d.status.name())}" th:classappend="${fmt.deployBadge(d.status.name())}"></span>
                        <div class="text-danger mt-2" th:if="${d.error}" th:text="${d.error}"></div>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item text-muted" th:if="${d.steps.isEmpty()}">Шаги ещё не начались…</li>
                        <li class="list-group-item" th:each="s : ${d.steps}">
                            <span th:class="'step-' + ${s.status}">
                                <span th:switch="${s.status}">
                                    <span th:case="'OK'">✔</span><span th:case="'FAILED'">✖</span>
                                    <span th:case="'SKIPPED'">–</span><span th:case="*">…</span>
                                </span>
                                <span th:text="${s.n} + '. ' + ${s.name}"></span>
                            </span>
                            <div class="small text-muted" th:if="${s.message}" th:text="${s.message}"></div>
                        </li>
                    </ul>
                </div>

                <div class="card border-warning" th:if="${d.status.name() == 'WAITING_HOST_KEY'}">
                    <div class="card-header bg-warning-subtle">Подтвердите ключ хоста</div>
                    <div class="card-body">
                        <p>Хост <strong th:text="${d.hostKeyHost} + ':' + ${d.hostKeyPort}"></strong> подключается впервые.
                            Сверьте fingerprint с тем, что показывает сам хост (<code>ssh-keygen -lf /etc/ssh/ssh_host_*_key.pub</code>).</p>
                        <dl class="mb-3">
                            <dt>Тип ключа</dt><dd th:text="${d.hostKeyType}"></dd>
                            <dt>Fingerprint (SHA256)</dt><dd><code th:text="${d.hostKeyFingerprint}"></code></dd>
                        </dl>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/deployments/{id}/confirm-host-key(id=${d.id})}" method="post">
                            <button class="btn btn-warning">Доверять и продолжить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <pre id="deploy-log" class="log-view" th:attr="data-stream=@{/deployments/{id}/stream(id=${d.id})}"></pre>
        </div>
    </div>
</th:block>
</body>
</html>
