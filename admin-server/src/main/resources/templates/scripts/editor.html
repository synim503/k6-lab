<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Редактор</title></head>
<body>
<th:block layout:fragment="content">
    <th:block th:replace="~{scripts/_head :: head(script=${script}, active='versions')}"></th:block>

    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <h5 class="mb-0">Редактор: <code id="edit-file-path" th:text="${path}"></code> <span class="text-muted fw-normal small">версия <span id="edit-ver-num" th:text="${v.number}"></span></span></h5>
        <a class="btn btn-outline-secondary btn-sm edit-nav-guard" id="edit-back-link" th:href="@{/scripts/{id}/versions/{vid}(id=${script.id},vid=${v.id})}"><i class="bi bi-arrow-left me-1"></i>К версии</a>
    </div>
    <div class="mb-2 small text-muted" id="edit-files-bar">Файлы версии:
        <a class="me-2 edit-file-link" th:each="f : ${scriptFiles}"
           th:href="@{/scripts/{id}/versions/{vid}/edit(id=${script.id},vid=${v.id},file=${f.path})}"
           th:attr="data-file-path=${f.path},data-file-url=@{/scripts/{id}/versions/{vid}/file(id=${script.id},vid=${v.id},path=${f.path})}"
           th:text="${f.path}" th:classappend="${f.path == path} ? 'fw-bold'"></a></div>
    <div class="alert alert-info py-2 small">Сохранение создаёт <strong>новую версию</strong>: старая остаётся неизменной. Сценарии, пороги и теги из <code>options</code> при сохранении вырезаются, их задаёт админка.</div>
    <form id="edit-form" th:action="@{/scripts/{id}/versions/{vid}/edit(id=${script.id},vid=${v.id})}" method="post"
          data-no-loading="true" th:attr="data-cur-vid=${v.id}">
        <input type="hidden" name="file" th:value="${path}">
        <input type="hidden" name="content" id="content">
        <div class="alert alert-danger py-2 small d-none" id="edit-err"></div>
        <div id="editor" class="position-relative" style="height: 62vh; border: 1px solid var(--k6-border); border-radius: 12px; overflow: hidden; background: #1e1e1e"
             th:attr="data-file-url=@{/scripts/{id}/versions/{vid}/file(id=${script.id},vid=${v.id},path=${path})}">
            <div id="edit-loading" class="d-flex align-items-center justify-content-center h-100 text-light gap-2 small">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>Загрузка редактора…
            </div>
        </div>
        <div class="sticky-actions">
            <input class="form-control" style="max-width:420px" name="comment" placeholder="Что изменилось (необязательно)" aria-label="Комментарий к версии">
            <button class="btn btn-primary" id="edit-save" type="submit" disabled title="Ctrl+S"><i class="bi bi-check-lg me-1"></i>Сохранить как новую версию</button>
            <a class="btn btn-outline-secondary edit-nav-guard" th:href="@{/scripts/{id}/versions/{vid}(id=${script.id},vid=${v.id})}">Отмена</a>
            <span class="dirty-flag"><i class="bi bi-circle-fill" style="font-size:.5rem"></i>Есть несохранённые изменения</span>
            <span class="cb-kbd-hint d-none d-md-inline"><kbd>Ctrl+S</kbd> сохранить</span>
        </div>
    </form>
</th:block>
<th:block layout:fragment="scripts">
    <script th:src="@{/webjars/monaco-editor/min/vs/loader.js}"></script>
    <script>
        (function () {
            var form = document.getElementById('edit-form');
            var box = document.getElementById('editor');
            var loadingEl = document.getElementById('edit-loading');
            var saveBtn = document.getElementById('edit-save');
            var errBox = document.getElementById('edit-err');
            var filePathEl = document.getElementById('edit-file-path');
            var fileInputEl = form ? form.querySelector('input[name="file"]') : null;
            var dirty = false;
            var submitting = false;
            var suppressDirty = false;
            var editor = null;
            var initialText = '';
            var fileLoadSeq = 0;

            function langFor(p) {
                return /\.json$/i.test(p || '') ? 'json' : /\.(js|mjs|cjs|ts)$/i.test(p || '') ? 'javascript' : 'plaintext';
            }

            function setDirty(v) {
                dirty = !!v;
                if (form) { form.classList.toggle('is-dirty', dirty); }
            }

            function switchFile(link, push) {
                if (!editor || !link) { return; }
                var nextPath = link.dataset.filePath || '';
                var nextFileUrl = link.dataset.fileUrl || '';
                if (!nextFileUrl) { location.href = link.href; return; }
                var mySeq = ++fileLoadSeq;
                if (errBox) { errBox.classList.add('d-none'); errBox.textContent = ''; }
                box.classList.add('k6-ajax-busy');
                fetch(nextFileUrl, {credentials: 'same-origin'}).then(function (r) {
                    if (!r.ok) { throw new Error('HTTP ' + r.status); }
                    return r.json();
                }).then(function (data) {
                    if (mySeq !== fileLoadSeq) { return; }
                    initialText = data.content || '';
                    var oldModel = editor.getModel();
                    var nextModel = monaco.editor.createModel(initialText, langFor(nextPath));
                    suppressDirty = true;
                    try {
                        editor.setModel(nextModel);
                        editor.setScrollTop(0);
                        editor.layout();
                    } finally {
                        suppressDirty = false;
                    }
                    if (oldModel && oldModel !== nextModel && (!oldModel.isDisposed || !oldModel.isDisposed())) {
                        try { oldModel.dispose(); } catch (_) {}
                    }
                    if (filePathEl) { filePathEl.textContent = nextPath; }
                    if (fileInputEl) { fileInputEl.value = nextPath; }
                    box.dataset.fileUrl = nextFileUrl;
                    document.querySelectorAll('#edit-files-bar a.edit-file-link').forEach(function (a) {
                        a.classList.toggle('fw-bold', a.dataset.filePath === nextPath);
                    });
                    setDirty(false);
                    var nextHref = link.getAttribute('href');
                    if (nextHref) {
                        if (push) { history.pushState({editFilePath: nextPath}, '', nextHref); }
                        else { history.replaceState({editFilePath: nextPath}, '', nextHref); }
                    }
                }).catch(function (e) {
                    if (mySeq !== fileLoadSeq) { return; }
                    if (window.k6Toast) { window.k6Toast('Не удалось открыть файл: ' + (e && e.message ? e.message : e), 'err'); }
                }).finally(function () {
                    if (mySeq === fileLoadSeq) { box.classList.remove('k6-ajax-busy'); }
                });
            }

            document.querySelectorAll('#edit-files-bar a.edit-file-link').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) { return; }
                    e.preventDefault();
                    if (fileInputEl && a.dataset.filePath === fileInputEl.value) { return; }
                    if (!editor) { location.href = a.href; return; }
                    if (!dirty || submitting) { switchFile(a, true); return; }
                    window.k6Confirm({
                        title: 'Несохранённые изменения',
                        message: 'В текущем файле есть несохранённые правки. Переключиться на «' + a.dataset.filePath + '» без сохранения?',
                        confirmText: 'Переключиться',
                        variant: 'warning'
                    }).then(function (ok) {
                        if (ok) { switchFile(a, true); }
                    });
                });
            });

            window.addEventListener('popstate', function () {
                if (!editor) { return; }
                var fp = new URLSearchParams(location.search).get('file');
                if (!fp) { return; }
                var link = document.querySelector('#edit-files-bar a.edit-file-link[data-file-path="' + CSS.escape(fp) + '"]');
                if (link && (!fileInputEl || fileInputEl.value !== fp)) { switchFile(link, false); }
            });

            function triggerSave() {
                if (!editor || !saveBtn || saveBtn.disabled) { return; }
                submitting = true;
                document.getElementById('content').value = editor.getValue();
                if (form.requestSubmit) { form.requestSubmit(saveBtn); } else { form.submit(); }
            }

            window.addEventListener('beforeunload', function (e) {
                if (dirty && !submitting) { e.preventDefault(); e.returnValue = ''; }
            });

            document.querySelectorAll('a.edit-nav-guard').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    if (!dirty || submitting) { return; }
                    e.preventDefault();
                    window.k6Confirm({
                        title: 'Несохранённые изменения',
                        message: 'В файле есть несохранённые правки. Перейти без сохранения?',
                        confirmText: 'Перейти',
                        variant: 'warning'
                    }).then(function (ok) {
                        if (ok) { submitting = true; location.href = a.href; }
                    });
                });
            });

            document.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    triggerSave();
                }
            });

            var base = location.origin + '/webjars/monaco-editor/min/vs';
            require.config({paths: {vs: base}});
            window.MonacoEnvironment = {
                getWorkerUrl: function () {
                    return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
                        "self.MonacoEnvironment={baseUrl:'" + base + "/../'};importScripts('" + base + "/base/worker/workerMain.js');");
                }
            };
            // типы k6 для подсказок: @types/k6 (лежат в jar, без интернета) регистрируются как node_modules
            var k6Types = ['index.d.ts', 'http/index.d.ts', 'metrics/index.d.ts', 'execution/index.d.ts', 'data/index.d.ts',
                'encoding/index.d.ts', 'crypto/index.d.ts', 'html/index.d.ts', 'ws/index.d.ts', 'options/index.d.ts',
                'net/grpc/index.d.ts', 'timers/index.d.ts', 'experimental/csv/index.d.ts', 'experimental/fs/index.d.ts', 'websockets/index.d.ts', 'global.d.ts'];
            require(['vs/editor/editor.main'], function () {
                var path = new URLSearchParams(location.search).get('file') || '';
                var lang = /\.(json)$/i.test(path) ? 'json' : 'javascript';
                fetch(box.dataset.fileUrl).then(function (r) {
                    if (!r.ok) { throw new Error('HTTP ' + r.status); }
                    return r.json();
                }).then(function (data) {
                    if (loadingEl) { loadingEl.remove(); }
                    initialText = data.content || '';
                    editor = monaco.editor.create(box, {value: initialText, language: lang, automaticLayout: true,
                        minimap: {enabled: false}, theme: 'vs-dark', tabSize: 2});
                    editor.onDidChangeModelContent(function () {
                        if (suppressDirty) { return; }
                        setDirty(editor.getValue() !== initialText);
                    });
                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, triggerSave);
                    var ts = monaco.languages.typescript;
                    ts.javascriptDefaults.setCompilerOptions({allowJs: true, checkJs: false, allowNonTsExtensions: true,
                        target: ts.ScriptTarget.ES2020, moduleResolution: ts.ModuleResolutionKind.NodeJs,
                        module: ts.ModuleKind.ESNext});
                    k6Types.forEach(function (f) {
                        fetch('/vendor/k6-types/' + f).then(function (r) { return r.ok ? r.text() : ''; })
                            .then(function (t) { if (t) { ts.javascriptDefaults.addExtraLib(t, 'file:///node_modules/@types/k6/' + f); } })
                            .catch(function () { /* редактор работает и без подсказок k6 */ });
                    });
                    form.addEventListener('submit', function (ev) {
                        ev.preventDefault();
                        if (!editor || !saveBtn || saveBtn.disabled) { return; }
                        var curVal = editor.getValue();
                        document.getElementById('content').value = curVal;
                        if (errBox) { errBox.classList.add('d-none'); errBox.textContent = ''; }
                        submitting = true;
                        var origHtml = saveBtn.innerHTML;
                        saveBtn.disabled = true;
                        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Сохранение…';
                        var body = new URLSearchParams();
                        new FormData(form).forEach(function (val, key) {
                            body.append(key, typeof val === 'string' ? val : '');
                        });
                        var csrf = window.K6 ? window.K6.getCsrf() : {token: ''};
                        if (csrf.token && !body.has('_csrf')) { body.append('_csrf', csrf.token); }
                        var req = window.K6 && window.K6.fetchHtml
                            ? window.K6.fetchHtml(form.getAttribute('action'), {method: 'POST', body: body})
                            : fetch(form.getAttribute('action'), {
                                method: 'POST',
                                body: body,
                                credentials: 'same-origin',
                                headers: {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'text/html'},
                                redirect: 'follow'
                            }).then(function (res) {
                                return res.text().then(function (html) {
                                    var finalUrl = new URL(res.url || form.action, location.origin);
                                    if (finalUrl.pathname === '/login') {
                                        location.href = finalUrl.href;
                                        var e = new Error('login'); e.redirectedToLogin = true; throw e;
                                    }
                                    return {res: res, doc: new DOMParser().parseFromString(html, 'text/html'), finalUrl: finalUrl};
                                });
                            });
                        req.then(function (r) {
                            var finalUrl = r.finalUrl;
                            var doc = r.doc;
                            var hasErr = false;
                            doc.querySelectorAll('main > .alert.alert-dismissible[role="alert"]').forEach(function (al) {
                                var txt = ((al.querySelector('span.flex-grow-1') || al).textContent || '').trim();
                                if (!txt) { return; }
                                var isErr = al.classList.contains('alert-danger');
                                if (isErr) {
                                    hasErr = true;
                                    if (errBox) { errBox.textContent = txt; errBox.classList.remove('d-none'); }
                                }
                                if (window.k6Toast) { window.k6Toast(txt, isErr ? 'err' : 'ok'); }
                            });
                            if (hasErr || !r.res.ok) {
                                if (!hasErr && window.k6Toast) { window.k6Toast('Ошибка сохранения (HTTP ' + r.res.status + ')', 'err'); }
                                return;
                            }
                            var m = /\/versions\/(\d+)(?:\/|$)/.exec(finalUrl.pathname);
                            var oldVid = form.dataset.curVid;
                            if (m && oldVid && m[1] !== oldVid) {
                                var newVid = m[1];
                                var oldRe = new RegExp('/versions/' + oldVid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=/|$)');
                                form.dataset.curVid = newVid;
                                form.setAttribute('action', form.getAttribute('action').replace(oldRe, '/versions/' + newVid));
                                document.querySelectorAll('a.edit-nav-guard, a.edit-file-link').forEach(function (a) {
                                    var h = a.getAttribute('href');
                                    if (h) { a.setAttribute('href', h.replace(oldRe, '/versions/' + newVid)); }
                                    if (a.dataset && a.dataset.fileUrl) {
                                        a.dataset.fileUrl = a.dataset.fileUrl.replace(oldRe, '/versions/' + newVid);
                                    }
                                });
                                if (box && box.dataset && box.dataset.fileUrl) {
                                    box.dataset.fileUrl = box.dataset.fileUrl.replace(oldRe, '/versions/' + newVid);
                                }
                                var verNumEl = document.getElementById('edit-ver-num');
                                var metaEl = doc.getElementById('version-meta');
                                var verNum = metaEl && metaEl.dataset ? metaEl.dataset.versionNumber : null;
                                if (!verNum) {
                                    var h5 = doc.querySelector('h5');
                                    var vm = h5 && /Версия\s+(\d+)/.exec(h5.textContent || '');
                                    verNum = vm ? vm[1] : null;
                                }
                                if (verNumEl && verNum) { verNumEl.textContent = verNum; }
                                var nextEditUrl = location.pathname.replace(oldRe, '/versions/' + newVid) + location.search;
                                history.replaceState(null, '', nextEditUrl);
                            }
                            initialText = curVal;
                            setDirty(false);
                            var cmt = form.querySelector('input[name="comment"]');
                            if (cmt) { cmt.value = ''; }
                        }).catch(function (err) {
                            if (err && err.redirectedToLogin) { return; }
                            if (window.k6Toast) { window.k6Toast('Не удалось сохранить версию — проверьте связь', 'err'); }
                        }).finally(function () {
                            submitting = false;
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = origHtml;
                        });
                    });
                    if (saveBtn) { saveBtn.disabled = false; }
                }).catch(function (e) {
                    if (loadingEl) { loadingEl.remove(); }
                    if (errBox) {
                        errBox.textContent = 'Не удалось загрузить файл в редактор: ' + (e && e.message ? e.message : e);
                        errBox.classList.remove('d-none');
                    }
                });
            });
        })();
    </script>
</th:block>
</body>
</html>
