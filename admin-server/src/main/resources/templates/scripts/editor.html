<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Редактор</title></head>
<body>
<th:block layout:fragment="content">
    <th:block th:replace="~{scripts/_head :: head(script=${script}, active='versions')}"></th:block>

    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <h5 class="mb-0">Редактор: <code id="edit-file-path" th:text="${path}"></code> <span class="text-muted fw-normal small">версия <span id="edit-ver-num" th:text="${v.number}"></span></span></h5>
            <span id="edit-save-status" class="badge rounded-pill text-bg-light border text-muted fw-normal">
                <i class="bi bi-check2 text-success me-1"></i>Сохранено
            </span>
        </div>
        <a class="btn btn-outline-secondary btn-sm edit-nav-guard" id="edit-back-link" th:href="@{/scripts/{id}/versions/{vid}(id=${script.id},vid=${v.id})}"><i class="bi bi-arrow-left me-1"></i>К версии</a>
    </div>
    <div class="mb-2 small text-muted" id="edit-files-bar">Файлы версии:
        <a class="me-2 edit-file-link" th:each="f : ${scriptFiles}"
           th:href="@{/scripts/{id}/versions/{vid}/edit(id=${script.id},vid=${v.id},file=${f.path})}"
           th:attr="data-file-path=${f.path},data-file-url=@{/scripts/{id}/versions/{vid}/file(id=${script.id},vid=${v.id},path=${f.path})}"
           th:text="${f.path}" th:classappend="${f.path == path} ? 'fw-bold'"></a>
    </div>
    <div id="edit-form"
         th:attr="data-cur-vid=${v.id},
                  data-autosave-url=@{/scripts/{id}/versions/{vid}/autosave(id=${script.id},vid=${v.id})},
                  data-file-path=${path}">
        <div class="alert alert-danger py-2 small d-none" id="edit-err"></div>
        <div class="alert alert-warning py-2 small d-none" id="edit-warn"></div>
        <div id="editor" class="position-relative" style="height: 68vh; border: 1px solid var(--k6-border); border-radius: 12px; overflow: hidden; background: #1e1e1e"
             th:attr="data-file-url=@{/scripts/{id}/versions/{vid}/file(id=${script.id},vid=${v.id},path=${path})}">
            <div id="edit-loading" class="d-flex align-items-center justify-content-center h-100 text-light gap-2 small">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>Загрузка редактора…
            </div>
        </div>
        <div class="small text-muted mt-2">
            Изменения сохраняются автоматически. Сценарии, пороги и теги из <code>options</code> при сохранении вырезаются — их задаёт админка.
        </div>
    </div>
</th:block>
<th:block layout:fragment="scripts">
    <script th:src="@{/webjars/monaco-editor/min/vs/loader.js}"></script>
    <script>
        (function () {
            var root = document.getElementById('edit-form');
            var box = document.getElementById('editor');
            var loadingEl = document.getElementById('edit-loading');
            var statusEl = document.getElementById('edit-save-status');
            var errBox = document.getElementById('edit-err');
            var warnBox = document.getElementById('edit-warn');
            var filePathEl = document.getElementById('edit-file-path');
            var curPath = root ? (root.dataset.filePath || '') : '';
            var curVid = root ? String(root.dataset.curVid || '') : '';
            var sessionVid = null;
            var autosaveUrl = root ? (root.dataset.autosaveUrl || '') : '';
            var savedText = '';
            var dirty = false;
            var saving = false;
            var queued = false;
            var saveTimer = null;
            var savePromise = null;
            var suppressChange = false;
            var editor = null;
            var fileLoadSeq = 0;

            function langFor(p) {
                return /\.json$/i.test(p || '') ? 'json' : /\.(js|mjs|cjs|ts)$/i.test(p || '') ? 'javascript' : 'plaintext';
            }

            function nowTime() {
                return new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            }

            function setStatus(state, text) {
                if (!statusEl) { return; }
                if (state === 'saving') {
                    statusEl.className = 'badge rounded-pill text-bg-light border text-primary fw-normal';
                    statusEl.innerHTML = '<span class="spinner-border spinner-border-sm me-1" style="width:.7rem;height:.7rem;border-width:2px" role="status" aria-hidden="true"></span>Сохранение…';
                } else if (state === 'pending') {
                    statusEl.className = 'badge rounded-pill text-bg-light border text-muted fw-normal';
                    statusEl.innerHTML = '<i class="bi bi-dot text-warning me-1"></i>Изменено…';
                } else if (state === 'err') {
                    statusEl.className = 'badge rounded-pill text-bg-danger fw-normal';
                    statusEl.innerHTML = '<i class="bi bi-exclamation-triangle me-1"></i>' + (text || 'Ошибка сохранения');
                } else {
                    statusEl.className = 'badge rounded-pill text-bg-light border text-muted fw-normal';
                    statusEl.innerHTML = '<i class="bi bi-check2 text-success me-1"></i>' + (text || 'Сохранено');
                }
            }

            function rewriteVersionLinks(newVid, verNum) {
                if (!newVid || newVid === curVid) { return; }
                var oldRe = new RegExp('/versions/' + curVid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=/|$)');
                curVid = String(newVid);
                if (root) { root.dataset.curVid = curVid; }
                autosaveUrl = autosaveUrl.replace(oldRe, '/versions/' + curVid);
                if (root) { root.dataset.autosaveUrl = autosaveUrl; }
                document.querySelectorAll('a.edit-nav-guard, a.edit-file-link').forEach(function (a) {
                    var h = a.getAttribute('href');
                    if (h) { a.setAttribute('href', h.replace(oldRe, '/versions/' + curVid)); }
                    if (a.dataset && a.dataset.fileUrl) {
                        a.dataset.fileUrl = a.dataset.fileUrl.replace(oldRe, '/versions/' + curVid);
                    }
                });
                if (box && box.dataset && box.dataset.fileUrl) {
                    box.dataset.fileUrl = box.dataset.fileUrl.replace(oldRe, '/versions/' + curVid);
                }
                var verNumEl = document.getElementById('edit-ver-num');
                if (verNumEl && verNum != null) { verNumEl.textContent = String(verNum); }
                var nextEditUrl = location.pathname.replace(oldRe, '/versions/' + curVid) + location.search;
                try { history.replaceState({editFilePath: curPath}, '', nextEditUrl); } catch (_) {}
            }

            function buildBody(content) {
                var body = new URLSearchParams();
                body.append('file', curPath);
                body.append('content', content);
                body.append('inPlace', (sessionVid !== null && curVid === sessionVid) ? 'true' : 'false');
                var csrf = window.K6 ? window.K6.getCsrf() : {token: ''};
                if (csrf.token) { body.append('_csrf', csrf.token); }
                return body;
            }

            function flushSave() {
                if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
                if (!editor || !autosaveUrl) { return Promise.resolve(true); }
                var curVal = editor.getValue();
                if (!dirty && curVal === savedText) {
                    return savePromise || Promise.resolve(true);
                }
                if (saving) {
                    queued = true;
                    return savePromise || Promise.resolve(true);
                }
                saving = true;
                queued = false;
                if (errBox) { errBox.classList.add('d-none'); errBox.textContent = ''; }
                setStatus('saving');
                var sentVal = curVal;
                var sentPath = curPath;
                var csrf = window.K6 ? window.K6.getCsrf() : {header: 'X-CSRF-TOKEN', token: ''};
                var headers = {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json'};
                if (csrf.token && csrf.header) { headers[csrf.header] = csrf.token; }
                savePromise = fetch(autosaveUrl, {
                    method: 'POST',
                    body: buildBody(sentVal),
                    credentials: 'same-origin',
                    headers: headers
                }).then(function (res) {
                    if (res.redirected && new URL(res.url, location.origin).pathname === '/login') {
                        location.href = res.url;
                        return null;
                    }
                    return res.json().then(function (data) { return {ok: res.ok, status: res.status, data: data}; });
                }).then(function (r) {
                    if (!r) { return false; }
                    if (!r.ok || !r.data || !r.data.ok) {
                        var msg = (r.data && r.data.error) ? r.data.error : ('Ошибка сохранения (HTTP ' + r.status + ')');
                        if (errBox) { errBox.textContent = msg; errBox.classList.remove('d-none'); }
                        setStatus('err', 'Ошибка сохранения');
                        return false;
                    }
                    if (r.data.versionId != null) {
                        var nextVid = String(r.data.versionId);
                        if (nextVid !== curVid) {
                            sessionVid = nextVid;
                            rewriteVersionLinks(nextVid, r.data.versionNumber);
                        } else if (sessionVid === null) {
                            sessionVid = curVid;
                        }
                    }
                    if (warnBox) {
                        if (r.data.valid === false && r.data.invalidReason) {
                            warnBox.textContent = r.data.invalidReason;
                            warnBox.classList.remove('d-none');
                        } else {
                            warnBox.classList.add('d-none');
                            warnBox.textContent = '';
                        }
                    }
                    if (curPath === sentPath) {
                        savedText = sentVal;
                        dirty = editor ? (editor.getValue() !== savedText) : false;
                    }
                    if (!dirty) {
                        setStatus('saved', 'Сохранено в ' + nowTime());
                    }
                    return true;
                }).catch(function () {
                    setStatus('err', 'Нет связи');
                    return false;
                }).finally(function () {
                    saving = false;
                    if (queued || (editor && curPath === sentPath && editor.getValue() !== savedText)) {
                        queued = false;
                        scheduleSave(300);
                    }
                });
                return savePromise;
            }

            function scheduleSave(delayMs) {
                if (saveTimer) { clearTimeout(saveTimer); }
                if (!saving) { setStatus('pending'); }
                saveTimer = setTimeout(function () { flushSave(); }, delayMs == null ? 700 : delayMs);
            }

            function sendKeepaliveIfDirty() {
                if (!editor || !autosaveUrl) { return; }
                var curVal = editor.getValue();
                if (!dirty && curVal === savedText) { return; }
                if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
                try {
                    var csrf = window.K6 ? window.K6.getCsrf() : {header: 'X-CSRF-TOKEN', token: ''};
                    var headers = {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json'};
                    if (csrf.token && csrf.header) { headers[csrf.header] = csrf.token; }
                    fetch(autosaveUrl, {
                        method: 'POST',
                        body: buildBody(curVal),
                        credentials: 'same-origin',
                        headers: headers,
                        keepalive: true
                    });
                } catch (_) {}
            }

            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') { sendKeepaliveIfDirty(); }
            });
            window.addEventListener('pagehide', sendKeepaliveIfDirty);

            function switchFile(link, push) {
                if (!editor || !link) { return; }
                var nextPath = link.dataset.filePath || '';
                var nextFileUrl = link.dataset.fileUrl || '';
                if (!nextFileUrl) { location.href = link.href; return; }
                var mySeq = ++fileLoadSeq;
                if (errBox) { errBox.classList.add('d-none'); errBox.textContent = ''; }
                box.classList.add('k6-ajax-busy');
                flushSave().then(function () {
                    if (mySeq !== fileLoadSeq) { return null; }
                    var latestUrl = link.dataset.fileUrl || nextFileUrl;
                    return fetch(latestUrl, {credentials: 'same-origin'}).then(function (r) {
                        if (!r.ok) { throw new Error('HTTP ' + r.status); }
                        return r.json();
                    });
                }).then(function (data) {
                    if (!data || mySeq !== fileLoadSeq) { return; }
                    savedText = data.content || '';
                    curPath = nextPath;
                    if (root) { root.dataset.filePath = nextPath; }
                    var oldModel = editor.getModel();
                    var nextModel = monaco.editor.createModel(savedText, langFor(nextPath));
                    suppressChange = true;
                    try {
                        editor.setModel(nextModel);
                        editor.setScrollTop(0);
                        editor.layout();
                    } finally {
                        suppressChange = false;
                    }
                    if (oldModel && oldModel !== nextModel && (!oldModel.isDisposed || !oldModel.isDisposed())) {
                        try { oldModel.dispose(); } catch (_) {}
                    }
                    if (filePathEl) { filePathEl.textContent = nextPath; }
                    box.dataset.fileUrl = link.dataset.fileUrl || nextFileUrl;
                    document.querySelectorAll('#edit-files-bar a.edit-file-link').forEach(function (a) {
                        a.classList.toggle('fw-bold', a.dataset.filePath === nextPath);
                    });
                    dirty = false;
                    setStatus('saved', 'Сохранено');
                    var nextHref = link.getAttribute('href');
                    if (nextHref) {
                        if (push) { history.pushState({editFilePath: nextPath}, '', nextHref); }
                        else { history.replaceState({editFilePath: nextPath}, '', nextHref); }
                    }
                }).catch(function (e) {
                    if (mySeq !== fileLoadSeq) { return; }
                    if (window.k6Toast) { window.k6Toast('Не удалось открыть файл: ' + (e && e.message ? e.message : e), 'err'); }
                }).finally(function () {
                    if (mySeq === fileLoadSeq) { box.classList.remove('k6-ajax-busy'); }
                });
            }

            document.querySelectorAll('#edit-files-bar a.edit-file-link').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) { return; }
                    e.preventDefault();
                    if (a.dataset.filePath === curPath) { return; }
                    if (!editor) { location.href = a.href; return; }
                    switchFile(a, true);
                });
            });

            document.querySelectorAll('a.edit-nav-guard').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) { return; }
                    if (!dirty && !saving) { return; }
                    e.preventDefault();
                    flushSave().finally(function () {
                        location.href = a.href;
                    });
                });
            });

            window.addEventListener('popstate', function () {
                if (!editor) { return; }
                var fp = new URLSearchParams(location.search).get('file');
                if (!fp) { return; }
                var link = document.querySelector('#edit-files-bar a.edit-file-link[data-file-path="' + CSS.escape(fp) + '"]');
                if (link && curPath !== fp) { switchFile(link, false); }
            });

            document.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    flushSave();
                }
            });

            var base = location.origin + '/webjars/monaco-editor/min/vs';
            require.config({paths: {vs: base}});
            window.MonacoEnvironment = {
                getWorkerUrl: function () {
                    return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
                        "self.MonacoEnvironment={baseUrl:'" + base + "/../'};importScripts('" + base + "/base/worker/workerMain.js');");
                }
            };
            // типы k6 для подсказок: @types/k6 (лежат в jar, без интернета) регистрируются как node_modules
            var k6Types = ['index.d.ts', 'http/index.d.ts', 'metrics/index.d.ts', 'execution/index.d.ts', 'data/index.d.ts',
                'encoding/index.d.ts', 'crypto/index.d.ts', 'html/index.d.ts', 'ws/index.d.ts', 'options/index.d.ts',
                'net/grpc/index.d.ts', 'timers/index.d.ts', 'experimental/csv/index.d.ts', 'experimental/fs/index.d.ts', 'websockets/index.d.ts', 'global.d.ts'];
            require(['vs/editor/editor.main'], function () {
                var path = new URLSearchParams(location.search).get('file') || curPath || '';
                var lang = langFor(path);
                fetch(box.dataset.fileUrl).then(function (r) {
                    if (!r.ok) { throw new Error('HTTP ' + r.status); }
                    return r.json();
                }).then(function (data) {
                    if (loadingEl) { loadingEl.remove(); }
                    savedText = data.content || '';
                    editor = monaco.editor.create(box, {value: savedText, language: lang, automaticLayout: true,
                        minimap: {enabled: false}, theme: 'vs-dark', tabSize: 2});
                    editor.onDidChangeModelContent(function () {
                        if (suppressChange) { return; }
                        var changed = editor.getValue() !== savedText;
                        dirty = changed;
                        if (changed) {
                            scheduleSave(700);
                        } else if (!saving) {
                            if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
                            setStatus('saved', 'Сохранено');
                        }
                    });
                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () { flushSave(); });
                    var ts = monaco.languages.typescript;
                    ts.javascriptDefaults.setCompilerOptions({allowJs: true, checkJs: false, allowNonTsExtensions: true,
                        target: ts.ScriptTarget.ES2020, moduleResolution: ts.ModuleResolutionKind.NodeJs,
                        module: ts.ModuleKind.ESNext});
                    k6Types.forEach(function (f) {
                        fetch('/vendor/k6-types/' + f).then(function (r) { return r.ok ? r.text() : ''; })
                            .then(function (t) { if (t) { ts.javascriptDefaults.addExtraLib(t, 'file:///node_modules/@types/k6/' + f); } })
                            .catch(function () { /* редактор работает и без подсказок k6 */ });
                    });
                }).catch(function (e) {
                    if (loadingEl) { loadingEl.remove(); }
                    if (errBox) {
                        errBox.textContent = 'Не удалось загрузить файл в редактор: ' + (e && e.message ? e.message : e);
                        errBox.classList.remove('d-none');
                    }
                });
            });
        })();
    </script>
</th:block>
</body>
</html>
