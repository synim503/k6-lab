<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title th:text="${script.name}">Скрипт</title></head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h3 class="mb-0" th:text="${script.name}"></h3>
        <a class="btn btn-link" th:href="@{/scripts}">← к списку</a>
    </div>
    <p class="text-muted" th:text="${script.description}"></p>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">Версии</div>
                    <table class="table table-sm table-hover mb-0">
                        <thead class="table-light"><tr><th>Версия</th><th>Источник</th><th>Комментарий</th><th>Операции</th><th>Модель</th><th>Создана</th></tr></thead>
                        <tbody>
                        <tr th:each="v, st : ${versions}">
                            <td><a th:href="@{/scripts/{id}/versions/{vid}(id=${script.id},vid=${v.id})}" th:text="'v' + ${v.number}"></a></td>
                            <td th:text="${v.sourceLabel()}"></td>
                            <td class="small" th:text="${v.comment}"></td>
                            <td th:text="${v.operations.size()}"></td>
                            <td><span class="badge" th:classappend="${v.validForModel} ? 'text-bg-success' : 'text-bg-danger'"
                                      th:text="${v.validForModel} ? 'пригодна' : 'непригодна'" th:title="${v.invalidReason}"></span></td>
                            <td class="small" th:text="${v.createdAt} + ' ' + ${v.createdBy}"></td>
                        </tr></tbody></table>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card mb-3"><div class="card-header">Новая версия (загрузка)</div>
                <form class="card-body" th:action="@{/scripts/{id}/versions(id=${script.id})}" method="post" enctype="multipart/form-data">
                    <input class="form-control mb-2" type="file" name="file" required>
                    <input class="form-control mb-2" name="entrypoint" placeholder="entrypoint (для архива)">
                    <input class="form-control mb-2" name="comment" placeholder="комментарий">
                    <button class="btn btn-primary btn-sm">Загрузить</button>
                </form></div>

            <div class="card mb-3"><div class="card-header">Git</div>
                <div class="card-body">
                    <div th:if="${gitRepo != null}" class="small mb-2">Репозиторий: <strong th:text="${gitRepo.name}"></strong>,
                        ветка: <strong th:text="${script.gitBranch} ?: '—'"></strong>, entrypoint: <code th:text="${script.gitEntrypoint}"></code></div>
                    <div th:if="${script.gitBranch != null}" class="mb-2 d-flex gap-2">
                        <button class="btn btn-sm btn-outline-secondary" hx-get="" th:attr="hx-get=@{/scripts/{id}/git-check(id=${script.id})}"
                                hx-target="#git-check" hx-indicator="#git-check">Проверить обновления</button>
                        <form th:action="@{/scripts/{id}/git-latest(id=${script.id})}" method="post">
                            <button class="btn btn-sm btn-outline-primary">Импортировать последнюю</button></form>
                    </div>
                    <div id="git-check" th:fragment="gitCheck">
                        <div class="text-danger small" th:if="${error}" th:text="${error}"></div>
                        <div th:if="${commits != null}">
                            <div class="text-success small" th:if="${commits.isEmpty()}">Новых коммитов нет</div>
                            <ul class="list-unstyled small mb-0" th:unless="${commits.isEmpty()}">
                                <li class="fw-semibold" th:text="'Новых коммитов: ' + ${commits.size()}"></li>
                                <li th:each="c : ${commits}"><code th:text="${#strings.substring(c.hash,0,8)}"></code>
                                    <span th:text="${c.message}"></span> <span class="text-muted" th:text="'— ' + ${c.author}"></span></li>
                            </ul>
                        </div>
                    </div>
                    <hr>
                    <form th:action="@{/scripts/{id}/git-import(id=${script.id})}" method="post">
                        <select class="form-select form-select-sm mb-2" name="repoId" required>
                            <option th:each="r : ${repos}" th:value="${r.id}" th:text="${r.name}" th:selected="${gitRepo != null and gitRepo.id == r.id}"></option></select>
                        <input class="form-control form-control-sm mb-2" name="ref" list="refs" placeholder="ветка / тег / коммит" required>
                        <datalist id="refs"><option th:each="r : ${refs}" th:value="${r.name}" th:text="${r.kind}"></option></datalist>
                        <input class="form-control form-control-sm mb-2" name="entrypoint" placeholder="путь к entrypoint" th:value="${script.gitEntrypoint}" required>
                        <button class="btn btn-sm btn-outline-primary" th:disabled="${repos.isEmpty()}">Импортировать версию</button>
                    </form>
                </div></div>

            <form th:action="@{/scripts/{id}/delete(id=${script.id})}" method="post" onsubmit="return confirm('Удалить скрипт и все его версии?')">
                <button class="btn btn-sm btn-outline-danger">Удалить скрипт</button></form>
        </div>
    </div>
</th:block>
</body>
</html>
