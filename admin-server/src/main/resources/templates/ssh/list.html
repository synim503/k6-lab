<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>SSH-учётки</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-terminal"></i></span>SSH-учётки</h3>
        <a class="btn btn-primary" th:href="@{/ssh-credentials/new}">Добавить</a>
    </div>
    <p class="text-muted">Секреты шифруются (AES-GCM) и после сохранения в интерфейсе не показываются.</p>
    <div class="card mb-4"><table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>Имя</th><th>Пользователь</th><th>Тип</th><th>sudo</th><th>Jump-host</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${items.isEmpty()}"><td colspan="6"><div class="empty-state"><i class="bi bi-inbox"></i>Учёток нет</div></td></tr>
        <tr th:each="c : ${items}">
            <td th:text="${c.name}"></td><td th:text="${c.username}"></td>
            <td th:text="${c.authType.name() == 'KEY'} ? 'ключ' : 'пароль'"></td>
            <td th:text="${c.sudoPasswordEnc != null} ? 'пароль задан' : '—'"></td>
            <td th:text="${c.jumpHost} ? ${c.jumpHost} + ':' + (${c.jumpPort} ?: 22) : '—'"></td>
            <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-secondary py-0" th:href="@{/ssh-credentials/{id}/edit(id=${c.id})}">изменить</a>
                <form class="d-inline" th:action="@{/ssh-credentials/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Удалить учётку?')">
                    <button class="btn btn-sm btn-outline-danger py-0">удалить</button></form>
            </td>
        </tr></tbody></table></div>

    <h5>Известные хосты (подтверждённые ключи)</h5>
    <div class="card"><table class="table table-sm mb-0">
        <thead class="table-light"><tr><th>Хост</th><th>Тип ключа</th><th>Fingerprint</th><th>Подтвердил</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${knownHosts.isEmpty()}"><td colspan="5"><div class="empty-state"><i class="bi bi-inbox"></i>Пока пусто</div></td></tr>
        <tr th:each="k : ${knownHosts}">
            <td th:text="${k.host} + ':' + ${k.port}"></td><td th:text="${k.keyType}"></td>
            <td><code class="small" th:text="${k.fingerprintSha256}"></code></td>
            <td th:text="${k.confirmedBy} + ', ' + ${k.confirmedAt}"></td>
            <td class="text-end"><form th:action="@{/ssh-credentials/known-hosts/{id}/delete(id=${k.id})}" method="post"
                                       onsubmit="return confirm('Забыть ключ хоста? Следующее подключение потребует нового подтверждения.')">
                <button class="btn btn-sm btn-outline-danger py-0">забыть</button></form></td>
        </tr></tbody></table></div>
</th:block>
</body>
</html>
