<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Аудит</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <div>
            <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-journal-text"></i></span>Журнал аудита</h3>
            <div class="sub mt-1">Кто и что менял в системе: скрипты, нагрузка, генераторы, настройки.</div></div>
        <form class="d-flex gap-2" method="get" th:action="@{/audit}">
            <input class="form-control" style="width:300px" type="search" name="q" th:value="${q}" placeholder="Действие, пользователь или объект" aria-label="Поиск по журналу">
            <button class="btn btn-outline-secondary"><i class="bi bi-search me-1"></i>Найти</button>
            <a class="btn btn-link" th:if="${q != null and !q.isBlank()}" th:href="@{/audit}">Сбросить</a>
        </form>
    </div>
    <div class="card"><div class="table-responsive"><table class="table table-hover table-sm align-middle mb-0">
        <thead><tr><th>Время</th><th>Пользователь</th><th>Действие</th><th>Объект</th><th>Детали</th><th>IP</th></tr></thead>
        <tbody>
        <tr th:if="${items.isEmpty()}"><td colspan="6"><div class="empty-state"><i class="bi bi-journal-text"></i>
            <span th:text="${q != null and !q.isBlank()} ? 'По запросу ничего не найдено' : 'Записей пока нет'"></span></div></td></tr>
        <tr th:each="a : ${items}">
            <td class="text-nowrap small text-muted" th:text="${#temporals.format(a.ts, 'dd.MM.yyyy HH:mm:ss')}"></td>
            <td class="fw-semibold" th:text="${a.username} ?: '—'"></td>
            <td><code th:text="${a.action}"></code></td>
            <td th:text="${a.entityType} ? ${a.entityType} + ' #' + ${a.entityId} : '—'"></td>
            <td class="small text-break" th:text="${a.details} ?: ''"></td>
            <td class="small text-muted" th:text="${a.ip} ?: ''"></td>
        </tr></tbody></table></div></div>
    <div class="mt-3 d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:if="${page > 0}" th:href="@{/audit(page=${page - 1},q=${q})}"><i class="bi bi-arrow-left me-1"></i>Новее</a>
        <a class="btn btn-sm btn-outline-secondary" th:if="${hasNext}" th:href="@{/audit(page=${page + 1},q=${q})}">Старше<i class="bi bi-arrow-right ms-1"></i></a>
    </div>
</th:block>
</body>
</html>
