<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Аудит</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-journal-text"></i></span>Журнал аудита</h3>
        <form class="d-flex gap-2" method="get" th:action="@{/audit}">
            <input class="form-control form-control-sm" name="q" th:value="${q}" placeholder="действие, пользователь, объект">
            <button class="btn btn-sm btn-outline-secondary">Найти</button>
        </form>
    </div>
    <div class="card"><table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>Время</th><th>Пользователь</th><th>Действие</th><th>Объект</th><th>Детали</th><th>IP</th></tr></thead>
        <tbody>
        <tr th:if="${items.isEmpty()}"><td colspan="6"><div class="empty-state"><i class="bi bi-inbox"></i>Записей нет</div></td></tr>
        <tr th:each="a : ${items}">
            <td class="text-nowrap" th:text="${#temporals.format(a.ts, 'dd.MM.yyyy HH:mm:ss')}"></td>
            <td th:text="${a.username} ?: '—'"></td>
            <td><code th:text="${a.action}"></code></td>
            <td th:text="${a.entityType} ? ${a.entityType} + ' #' + ${a.entityId} : '—'"></td>
            <td class="small text-break" th:text="${a.details} ?: ''"></td>
            <td th:text="${a.ip} ?: ''"></td>
        </tr></tbody></table></div>
    <div class="mt-2 d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:if="${page > 0}" th:href="@{/audit(page=${page - 1},q=${q})}">← новее</a>
        <a class="btn btn-sm btn-outline-secondary" th:if="${hasNext}" th:href="@{/audit(page=${page + 1},q=${q})}">старше →</a>
    </div>
</th:block>
</body>
</html>
