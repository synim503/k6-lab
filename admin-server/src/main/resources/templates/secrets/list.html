<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Секреты</title></head>
<body>
<th:block layout:fragment="content">
    <h3 class="mb-3 d-flex align-items-center gap-2"><span class="icon-tile"><i class="bi bi-key"></i></span>Секреты скриптов</h3>
    <p class="text-muted">Значения шифруются (AES-GCM) и нигде не показываются. В переменных окружения скрипта на секрет ссылаются как <code>${secret:NAME}</code>;
        подстановка выполняется только на агенте, а в логах значение маскируется.</p>
    <div class="card mb-4"><div class="card-header">Создать или заменить секрет</div>
        <form class="card-body row g-2" th:action="@{/secrets}" method="post" autocomplete="off">
            <div class="col-md-3"><input class="form-control" name="name" placeholder="NAME" required></div>
            <div class="col-md-4"><input class="form-control" type="password" name="value" placeholder="значение (пусто = не менять описание)" autocomplete="new-password"></div>
            <div class="col-md-3"><input class="form-control" name="description" placeholder="описание"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Сохранить</button></div>
        </form></div>
    <div class="card"><table class="table table-sm mb-0">
        <thead class="table-light"><tr><th>Имя</th><th>Ссылка</th><th>Описание</th><th>Обновлён</th><th></th></tr></thead>
        <tbody>
        <tr th:if="${items.isEmpty()}"><td colspan="5"><div class="empty-state"><i class="bi bi-inbox"></i>Секретов нет</div></td></tr>
        <tr th:each="s : ${items}">
            <td th:text="${s.name}"></td><td><code th:text="'${secret:' + ${s.name} + '}'"></code></td>
            <td th:text="${s.description}"></td><td th:text="${s.updatedAt}"></td>
            <td class="text-end"><form th:action="@{/secrets/{id}/delete(id=${s.id})}" method="post" onsubmit="return confirm('Удалить секрет?')"><button class="btn btn-sm btn-outline-danger py-0">удалить</button></form></td>
        </tr></tbody></table></div>
</th:block>
</body>
</html>
