<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Поля параметров профиля по типу (подгружаются htmx). Параметры: schema, values, typeSelected, templateId, templates -->
<div th:fragment="fields" id="fields">
    <div class="row g-3">
        <div class="col-md-4" th:if="${typeSelected.name() == 'TEMPLATE'}">
            <label class="form-label">Шаблон профиля</label>
            <select class="form-select" name="templateId" required hx-get="/profiles/fields" hx-target="#fields" hx-swap="outerHTML"
                    hx-include="[name=type]" hx-trigger="change">
                <option value="">— выберите —</option>
                <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}" th:selected="${t.id == templateId}"></option></select>
        </div>
        <div class="col-12" th:if="${typeSelected.name() == 'CUSTOM'}">
            <label class="form-label" th:text="${schema[0].label}"></label>
            <textarea class="form-control font-monospace" rows="8" name="p.steps" th:text="${values.get('steps') != null ? values.get('steps') : schema[0].defaultValue}"></textarea>
            <div class="form-text" th:text="${schema[0].hint}"></div>
        </div>
        <th:block th:unless="${typeSelected.name() == 'CUSTOM'}">
            <div class="col-md-3" th:each="p : ${schema}">
                <label class="form-label" th:text="${p.label}"></label>
                <input class="form-control" th:name="'p.' + ${p.name}" th:value="${values.get(p.name) != null ? values.get(p.name) : p.defaultValue}">
                <div class="form-text" th:if="${p.hint != ''}" th:text="${p.hint}"></div>
            </div>
        </th:block>
    </div>
</div>
</body>
</html>
