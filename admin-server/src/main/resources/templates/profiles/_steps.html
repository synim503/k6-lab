<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="steps" class="p-2">
    <div class="alert alert-danger py-1 mb-0" th:if="${error}" th:text="${error}"></div>
    <table class="table table-sm table-bordered mb-0 bg-white" th:if="${steps != null}">
        <thead class="table-light"><tr><th>№</th><th>Метка</th><th>Уровень, %</th><th>Разгон, с</th><th>Удержание, с</th></tr></thead>
        <tbody><tr th:each="s : ${steps}"><td th:text="${s.no}"></td><td th:text="${s.label}"></td>
            <td th:text="${#numbers.formatDecimal(s.levelPct, 1, 2)}"></td><td th:text="${s.rampSec}"></td><td th:text="${s.holdSec}"></td></tr></tbody>
        <tfoot><tr><td colspan="5" class="small text-muted" th:with="t=${#aggregates.sum(steps.![rampSec + holdSec])}"
                    th:text="'Ступеней: ' + ${steps.size()} + ', общая длительность: ' + ${t} + ' с (' + ${#numbers.formatDecimal(t / 60.0, 1, 1)} + ' мин)'"></td></tr></tfoot>
    </table>
</div>
</body>
</html>
