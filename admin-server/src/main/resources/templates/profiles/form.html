<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Профиль теста</title></head>
<body>
<th:block layout:fragment="content">
    <h3 class="mb-3" th:text="${p == null} ? 'Новый профиль теста' : 'Профиль: ' + ${p.name}"></h3>
    <form th:action="@{/profiles}" method="post" class="card card-body">
        <input type="hidden" name="id" th:if="${p != null}" th:value="${p.id}">
        <div class="row g-3 mb-3">
            <div class="col-md-4"><label class="form-label">Имя</label>
                <input class="form-control" name="name" required th:value="${p != null ? p.name : formName}"></div>
            <div class="col-md-4"><label class="form-label">Тип профиля</label>
                <select class="form-select" name="type" hx-get="/profiles/fields" hx-target="#fields" hx-swap="outerHTML"
                        hx-include="[name=templateId]" th:attr="hx-vals=${p != null ? '{&quot;id&quot;: ' + p.id + '}' : '{}'}">
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.title}" th:selected="${t == typeSelected}"></option></select></div>
            <div class="col-md-2"><label class="form-label">Graceful stop, с</label>
                <input class="form-control" type="number" min="0" name="gracefulStopSec" th:value="${p != null ? p.gracefulStopSec : (formGracefulStop != null ? formGracefulStop : 30)}"></div>
            <div class="col-md-2"><label class="form-label">Graceful ramp-down, с</label>
                <input class="form-control" type="number" min="0" name="gracefulRampDownSec" th:value="${p != null ? p.gracefulRampDownSec : (formGracefulRampDown != null ? formGracefulRampDown : 30)}"></div>
            <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="template" value="true" id="tpl" th:checked="${p != null and p.template}">
                <label class="form-check-label" for="tpl">Шаблон профиля (для клонирования)</label></div>
        </div>
        <div th:replace="~{profiles/_fields :: fields}"></div>
        <p class="small text-muted mt-3 mb-0">Уровень % применяется ко всем операциям модели (у отдельной операции уровень можно зафиксировать в модели).
            Каждая ступень имеет номер и интервал удержания - на нём считаются результаты.</p>
        <div class="mt-3 d-flex gap-2"><button class="btn btn-primary">Сохранить</button><a class="btn btn-link" th:href="@{/profiles}">Отмена</a></div>
    </form>
</th:block>
</body>
</html>
