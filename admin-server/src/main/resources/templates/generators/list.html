<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/main}">
<head><title>Генераторы</title></head>
<body>
<th:block layout:fragment="content">
    <div class="page-head">
        <h3 class="mb-0"><span class="icon-tile"><i class="bi bi-hdd-network"></i></span>Генераторы</h3>
        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-outline-secondary" th:href="@{/deployments}"><i class="bi bi-tools me-1"></i>Операции</a>
            <form sec:authorize="hasRole('ADMIN')" th:action="@{/generators/update-all}" method="post"
                  onsubmit="return confirm('Обновить агент и k6 на всех генераторах с устаревшей версией? Занятые будут пропущены.')">
                <button class="btn" th:classappend="${outdated > 0} ? 'btn-outline-warning' : 'btn-outline-secondary'">
                    <i class="bi bi-arrow-repeat me-1"></i>Обновить агент на всех
                    <span class="badge text-bg-warning ms-1" th:if="${outdated > 0}" th:text="${outdated}"></span></button></form>
            <div class="btn-group" sec:authorize="hasRole('ADMIN')">
            <a class="btn btn-primary" th:href="@{/generators/add}"><i class="bi bi-plus-lg me-1"></i>Добавить сервер</a>
            <a class="btn btn-outline-secondary" th:href="@{/generators/new}">Расширенно</a>
            <a class="btn btn-outline-primary" th:href="@{/generators/bulk}">Массовое добавление</a>
            </div>
        </div>
    </div>

    <div id="gen-table" hx-get="/generators/table" hx-trigger="every 5s" hx-swap="outerHTML" th:fragment="table">
        <div class="card"><div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light"><tr>
                    <th>Имя</th><th>Хост</th><th>Статус</th><th>CPU</th><th>RAM</th><th>Сеть (rx / tx, МБ/с)</th>
                    <th>Load</th><th>Диск, ГБ</th><th>Сокеты</th><th>Часы</th><th>Версии агент / k6</th>
                </tr></thead>
                <tbody>
                <tr th:if="${generators.isEmpty()}"><td colspan="11"><div class="empty-state"><i class="bi bi-inbox"></i>Генераторов пока нет</div></td></tr>
                <tr th:each="v : ${generators}">
                    <td><a th:href="@{/generators/{id}(id=${v.g().id})}" th:text="${v.g().name}"></a></td>
                    <td th:text="${v.g().host}"></td>
                    <td><span class="badge" th:classappend="${v.badgeClass}" th:text="${v.statusLabel}"></span>
                        <form class="d-inline" sec:authorize="hasRole('ADMIN')" th:if="${v.g().status.name() == 'ERROR'}"
                              th:action="@{/generators/{id}/redeploy(id=${v.g().id},keepMode=true)}" method="post"
                              onsubmit="return confirm('Повторить установку агента?')">
                            <button class="btn btn-sm btn-outline-danger py-0 ms-1" title="Повторить установку"><i class="bi bi-arrow-repeat"></i></button></form></td>
                    <td th:classappend="${v.cpuHot} ? 'metric-hot'" th:text="${v.cpu != null} ? ${#numbers.formatDecimal(v.cpu, 1, 0)} + '%' : '—'"></td>
                    <td th:text="${v.memPct != null} ? ${#numbers.formatDecimal(v.memPct, 1, 0)} + '%' : '—'"></td>
                    <td th:text="${v.netRx != null} ? ${#numbers.formatDecimal(v.netRx / 1048576.0, 1, 2)} + ' / ' + ${#numbers.formatDecimal(v.netTx / 1048576.0, 1, 2)} : '—'"></td>
                    <td th:text="${v.load1 != null} ? ${#numbers.formatDecimal(v.load1, 1, 2)} : '—'"></td>
                    <td th:text="${v.diskFreeGb != null} ? ${v.diskFreeGb} : '—'"></td>
                    <td th:text="${v.sockets != null} ? ${v.sockets} : '—'"></td>
                    <td th:classappend="${v.clockBad} ? 'metric-hot' : (${v.clockWarn} ? 'text-warning')"
                        th:text="${v.clockOffsetMs != null} ? ${v.clockOffsetMs} + ' мс' : '—'"></td>
                    <td>
                        <span th:text="${v.g().agentVersion} ?: '—'" th:classappend="${v.agentDrift} ? 'text-warning fw-bold'"
                              th:title="${v.agentDrift} ? 'По умолчанию: ' + ${v.defaultAgent}"></span> /
                        <span th:text="${v.g().k6Version} ?: '—'" th:classappend="${v.k6Drift} ? 'text-warning fw-bold'"
                              th:title="${v.k6Drift} ? 'По умолчанию: ' + ${v.defaultK6}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div></div>
    </div>
</th:block>
</body>
</html>
