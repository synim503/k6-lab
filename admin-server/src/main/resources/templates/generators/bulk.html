<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Массовое добавление</title></head>
<body>
<th:block layout:fragment="content">
    <nav class="crumbs" aria-label="Навигация"><a th:href="@{/generators}">Генераторы</a><i class="bi bi-chevron-right"></i><span>Массовое добавление</span></nav>
    <div class="page-head"><h3><span class="icon-tile"><i class="bi bi-collection"></i></span>Массовое добавление генераторов</h3></div>
    <form th:action="@{/generators/bulk}" th:object="${form}" method="post" class="card card-body">
        <div class="row g-3">
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0" for="hosts">Хосты (по одному в строке: <code>host[:порт] [имя]</code>)</label>
                    <span class="badge text-bg-secondary" id="bulk-host-count">0 хостов</span>
                </div>
                <textarea class="form-control font-monospace" rows="8" th:field="*{hosts}"
                          placeholder="10.0.0.11&#10;10.0.0.12:2222 gen-02&#10;# комментарий"></textarea>
                <div class="text-danger small" th:errors="*{hosts}"></div>
                <div class="form-text">Имя по умолчанию — адрес хоста. Установки идут параллельно с ограничением числа потоков.</div>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="sshPort">Порт SSH по умолчанию</label>
                <input class="form-control" type="number" min="1" max="65535" th:field="*{sshPort}">
            </div>
            <th:block th:replace="~{generators/_fields :: common}"></th:block>
        </div>
        <div class="mt-4 d-flex gap-2 flex-wrap">
            <button class="btn btn-primary" type="submit"><i class="bi bi-cloud-arrow-down me-1"></i>Установить на все</button>
            <a class="btn btn-outline-secondary" th:href="@{/generators}">Отмена</a>
        </div>
    </form>
</th:block>
<th:block layout:fragment="scripts">
    <script th:inline="none">
        (function () {
            var ta = document.getElementById('hosts');
            var badge = document.getElementById('bulk-host-count');
            if (!ta || !badge) { return; }
            function sync() {
                var n = ta.value.split(/\r?\n/).filter(function (l) {
                    var s = l.trim();
                    return s && s.charAt(0) !== '#';
                }).length;
                var m10 = n % 10, m100 = n % 100;
                var word = (m10 === 1 && m100 !== 11) ? 'хост' : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'хоста' : 'хостов');
                badge.textContent = n + ' ' + word;
                badge.className = 'badge ' + (n > 0 ? 'text-bg-primary' : 'text-bg-secondary');
            }
            ta.addEventListener('input', sync);
            sync();
        })();
    </script>
</th:block>
</body>
</html>
